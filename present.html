<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch — Lessig-ish Style</title>
<meta name="description" content="A Lessig-ish Style demo: words arrive exactly as spoken. Press play; use the speed control to set the pace.">

<style>
  :root{
    --ground:#0a0e14; --ground-2:#10161f; --panel:#141b26;
    --ink:#eef2f7; --muted:#7c8794; --faint:#38424f;
    --accent:#ff9d3d; --accent-hot:#ff7a1a;
    --survive:#4ec9a3; --gone:#ff5d5d;
    --stage-pad: clamp(1.2rem, 4vw, 4rem);
    --display:-apple-system,"Helvetica Neue","Segoe UI",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Menlo",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--display);
    -webkit-font-smoothing:antialiased; overflow:hidden;
    display:flex; flex-direction:column;
  }
  /* subtle projection vignette */
  .stage-wrap{position:relative; flex:1 1 auto; min-height:0;
    background:radial-gradient(120% 90% at 50% 42%, var(--ground-2) 0%, var(--ground) 62%);}
  .stage{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:var(--stage-pad); gap:clamp(1rem,3vh,2.4rem);
  }
  .kicker{
    font-family:var(--mono); font-size:clamp(.62rem,1.4vw,.8rem);
    letter-spacing:.34em; text-transform:uppercase; color:var(--muted);
    font-weight:600;
  }
  /* stage type scale */
  .lines{display:flex; flex-direction:column; gap:clamp(.1rem,1.4vh,.7rem); align-items:center;}
  .line{
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:.28em; line-height:.98;
    font-weight:800; letter-spacing:-.02em;
    font-size:clamp(2.1rem,7.4vw,6.2rem);
  }
  .line.sm{font-size:clamp(1.4rem,4vw,3rem); font-weight:700; letter-spacing:-.01em;}
  .line.turn{font-size:clamp(2.6rem,9vw,7.6rem); color:var(--accent);
    text-shadow:0 0 60px rgba(255,157,61,.28);}
  .line.ignite{font-size:clamp(3rem,12vw,10rem); color:var(--accent);
    text-shadow:0 0 90px rgba(255,122,26,.45); letter-spacing:.01em;}
  .word{
    display:inline-block; opacity:0; transform:translateY(.5em) scale(.94);
    transition:opacity .34s cubic-bezier(.2,.7,.2,1), transform .34s cubic-bezier(.2,.7,.2,1);
    will-change:opacity,transform;
  }
  .word.in{opacity:1; transform:none}
  .tag{ /* the ✓ survives / ✗ gone chips */
    display:inline-flex; align-items:baseline; gap:.34em;
    font-weight:800;
  }
  .verdict{font-size:.62em; font-weight:800; letter-spacing:-.01em;}
  .survive .verdict{color:var(--survive)} .survive .mark{color:var(--survive)}
  .gone .verdict{color:var(--gone)} .gone .mark{color:var(--gone)}
  .mark{font-size:.8em}
  .neq{color:var(--accent); font-weight:800; padding:0 .12em}
  figure.illus{margin:0; display:flex; align-items:center; justify-content:center;
    opacity:0; transform:scale(.96); transition:opacity .5s ease, transform .5s ease;}
  figure.illus.in{opacity:1; transform:none}
  figure.illus svg{width:clamp(120px,20vw,240px); height:auto; display:block}

  /* frame chrome */
  .topbar{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
    align-items:center; padding:.9rem 1.2rem; pointer-events:none;
    font-family:var(--mono); font-size:.68rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted);}
  .topbar .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
    display:inline-block;margin-right:.55em;box-shadow:0 0 12px var(--accent);vertical-align:middle}
  .beatno{color:var(--faint)}

  /* big centered play affordance (title state) */
  .starthint{display:flex;flex-direction:column;align-items:center;gap:1.3rem}
  .playbig{
    width:clamp(74px,11vw,104px); height:clamp(74px,11vw,104px); border-radius:50%;
    border:2px solid var(--accent); background:rgba(255,157,61,.06); color:var(--accent);
    cursor:pointer; display:grid; place-items:center; transition:transform .2s ease, background .2s ease;
    box-shadow:0 0 0 0 rgba(255,157,61,.5);
  }
  @media(prefers-reduced-motion:no-preference){ .playbig.pulse{animation:pulse 2.4s ease-out infinite} }
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,157,61,.35)}70%{box-shadow:0 0 0 22px rgba(255,157,61,0)}100%{box-shadow:0 0 0 0 rgba(255,157,61,0)}}
  .playbig:hover{transform:scale(1.06); background:rgba(255,157,61,.13)}
  .playbig svg{width:42%;height:42%;margin-left:8%}

  /* control rail */
  .rail{flex:0 0 auto; display:flex; align-items:center; gap:1rem;
    padding:.7rem clamp(.8rem,2vw,1.4rem); background:var(--ground-2);
    border-top:1px solid var(--faint);}
  .rail button{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink); background:var(--panel); border:1px solid var(--faint);
    padding:.5rem .8rem; border-radius:7px; cursor:pointer; transition:border-color .15s, color .15s;
  }
  .rail button:hover{border-color:var(--accent); color:var(--accent)}
  .rail button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .rail button:disabled{opacity:.4; cursor:default; border-color:var(--faint); color:var(--muted)}
  .progress{flex:1 1 auto; height:4px; background:var(--faint); border-radius:99px; overflow:hidden}
  .progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent-hot),var(--accent));
    transition:width .3s linear}
  .pace{display:flex; align-items:center; gap:.55rem; color:var(--muted);
    font-family:var(--mono); font-size:.7rem; letter-spacing:.06em; white-space:nowrap}
  .pace input[type=range]{width:clamp(74px,10vw,130px); accent-color:var(--accent)}
  .paceval{color:var(--ink); min-width:2.6em; text-align:right; font-variant-numeric:tabular-nums}
  .hintline{position:absolute; bottom:.7rem; left:50%; transform:translateX(-50%);
    font-family:var(--mono); font-size:.62rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--faint); pointer-events:none}
  @media (max-width:640px){ .pace{display:none} .hintline{display:none} }
</style>
<div class="stage-wrap">
  <div class="topbar">
    <span><span class="dot"></span><a href="index.html" style="color:inherit;text-decoration:none"><b style="color:var(--accent)">Lessig-ish</b> Style</a></span>
    <span class="beatno" id="beatno">press play</span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="hintline">space to play/pause · ← → to step</div>
</div>
<div class="rail">
  <button id="btnPlay">▶ Play</button>
  <button id="btnBack">← Back</button>
  <button id="btnNext">Step →</button>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  <div class="pace">speed
    <input id="pace" type="range" min="0.6" max="1.6" step="0.1" value="1" aria-label="speed">
    <span class="paceval" id="paceval">1.0×</span>
  </div>
  <button id="btnReplay">↺ Replay</button>
</div>

(() => {
  const A='var(--accent)',I='var(--muted)',S='var(--survive)',G='var(--gone)';
  const svgs = {
    workspace:()=>`<svg viewBox="0 0 200 160" fill="none" stroke-width="2.4">${[[40,34],[160,44],[30,120],[168,116],[100,20],[96,150]].map(([x,y])=>`<line x1="100" y1="80" x2="${x}" y2="${y}" stroke="${I}" opacity=".5"/>`).join('')}${[[40,34],[160,44],[30,120],[168,116],[100,20],[96,150]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7" fill="${I}" opacity=".55"/>`).join('')}<circle cx="100" cy="80" r="15" fill="${A}"/><circle cx="100" cy="80" r="24" stroke="${A}" opacity=".6"/></svg>`,
    del:()=>`<svg viewBox="0 0 200 160" fill="none" stroke-width="2.4">${[[40,34],[160,44],[30,120],[168,116],[100,20],[96,150]].map(([x,y])=>`<line x1="100" y1="80" x2="${x}" y2="${y}" stroke="${I}" opacity=".18" stroke-dasharray="3 5"/>`).join('')}${[[40,34],[160,44],[30,120],[168,116],[100,20],[96,150]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7" fill="${I}" opacity=".25"/>`).join('')}<circle cx="100" cy="80" r="24" stroke="${G}" opacity=".8"/><line x1="84" y1="64" x2="116" y2="96" stroke="${G}" stroke-width="3.4"/><line x1="116" y1="64" x2="84" y2="96" stroke="${G}" stroke-width="3.4"/></svg>`,
    board:()=>`<svg viewBox="0 0 200 170" fill="none">${Array.from({length:9}).map((_,i)=>{const y=18+i*17,o=(1-i/11).toFixed(2),w=150-i*3;return `<rect x="${25+i*1.5}" y="${y}" width="${w}" height="8" rx="3" fill="${I}" opacity="${o}"/>`}).join('')}<rect x="0" y="150" width="200" height="20" fill="url(#fade)"/><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ground)" stop-opacity="0"/><stop offset="1" stop-color="var(--ground)"/></linearGradient></defs></svg>`,
    ignition:()=>`<svg viewBox="0 0 200 170" fill="none" stroke-width="2.6"><line x1="24" y1="120" x2="176" y2="120" stroke="${I}" opacity=".4"/><path d="M100 120 L100 46" stroke="${A}"/><path d="M100 40 l-13 26 l13 -7 l13 7 z" fill="${A}" stroke="none"/><circle cx="100" cy="120" r="6" fill="${A}"/>${[[-30,-18],[30,-18],[-42,6],[42,6],[0,-40]].map(([dx,dy])=>`<line x1="100" y1="120" x2="${100+dx}" y2="${120+dy}" stroke="${A}" opacity=".55" stroke-width="1.8"/>`).join('')}</svg>`
  };
  const au=document.getElementById('au'), stage=document.getElementById('stage'), bar=document.getElementById('bar'),
        beatno=document.getElementById('beatno'), btnPlay=document.getElementById('btnPlay'),
        pace=document.getElementById('pace'), paceval=document.getElementById('paceval');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let curBeat=-1;

  function tokenSpan(tok){
    const s=document.createElement('span'); s.className='word'; s.dataset.sec=tok.sec;
    if(tok.neq){ s.className='word neq'; s.textContent='≠'; return s; }
    if(tok.raw!==undefined){ s.textContent=tok.raw; return s; }
    if(tok.tag){ s.className='word tag '+tok.tag; s.innerHTML=`<span>${tok.word}</span> <span class="mark">${tok.mk}</span> <span class="verdict">${tok.verdict}</span>`; return s; }
    s.textContent=tok.t; return s;
  }
  function renderBeat(bi){
    curBeat=bi; const b=DATA.beats[bi]; stage.innerHTML='';
    if(b.svg){ const f=document.createElement('figure'); f.className='illus in'; f.innerHTML=svgs[b.svg](); stage.appendChild(f); }
    const wrap=document.createElement('div'); wrap.className='lines'; stage.appendChild(wrap);
    b.lines.forEach((line,li)=>{ const el=document.createElement('div'); el.className='line '+((b.cls&&b.cls[li])||''); line.forEach(tok=>el.appendChild(tokenSpan(tok))); wrap.appendChild(el); });
    beatno.textContent='beat '+String(bi+1).padStart(2,'0')+' / '+DATA.beats.length;
  }
  function endCard(){
    curBeat=DATA.beats.length; stage.innerHTML='';
    const box=document.createElement('div'); box.className='starthint';
    box.innerHTML='<div class="kicker">SOMA Brain Trust · The Workspace Round</div><div class="lines"><div class="line turn" style="font-size:clamp(1.8rem,5.4vw,3.6rem)">Just show more.</div></div><div class="kicker" style="color:var(--faint)">made with Lessig-ish Style · SomaScript + SomaCut</div>';
    stage.appendChild(box); beatno.textContent='end'; bar.style.width='100%';
  }
  function titleCard(){
    curBeat=-1; stage.innerHTML='';
    const box=document.createElement('div'); box.className='starthint';
    box.innerHTML='<div class="kicker">Lessig-ish Style — press play</div><div class="lines"><div class="line" style="font-size:clamp(2rem,6vw,4.4rem)">A Lessig-style<br>presenter</div></div><button class="playbig '+(reduce?'':'pulse')+'" id="pb" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><div class="kicker" style="color:var(--faint)">press play — the voice sets the pace</div>';
    stage.appendChild(box); box.querySelector('#pb').onclick=()=>au.play();
  }
  // main loop: audio time drives beat + word reveal
  function frame(){
    const t=au.currentTime;
    if(t>=DATA.endSec-0.02 && au.ended){ if(curBeat!==DATA.beats.length) endCard(); }
    else {
      let bi=-1; for(let i=0;i<DATA.beats.length;i++){ if(DATA.beats[i].startSec<=t+0.001) bi=i; else break; }
      if(bi>=0){ if(bi!==curBeat) renderBeat(bi);
        stage.querySelectorAll('.word').forEach(w=>{ if(parseFloat(w.dataset.sec)<=t+0.001) w.classList.add('in'); }); }
    }
    if(DATA.endSec>0) bar.style.width=Math.min(100,t/DATA.endSec*100)+'%';
    requestAnimationFrame(frame);
  }
  au.addEventListener('play',()=>{ btnPlay.textContent='❚❚ Pause'; if(curBeat===-1&&au.currentTime<0.05){} });
  au.addEventListener('pause',()=>{ if(!au.ended) btnPlay.textContent='▶ Play'; });
  au.addEventListener('ended',()=>{ btnPlay.textContent='↺ Replay'; endCard(); });
  btnPlay.onclick=()=>{ if(au.ended){ au.currentTime=0; au.play(); } else au.paused?au.play():au.pause(); };
  document.getElementById('btnReplay').onclick=()=>{ au.currentTime=0; au.play(); };
  function seekBeat(d){ let target=Math.max(0,Math.min(DATA.beats.length-1,(curBeat<0?0:curBeat)+d)); au.pause(); au.currentTime=DATA.beats[target].startSec+0.005; renderBeat(target); stage.querySelectorAll('.word').forEach(w=>w.classList.add('in')); }

  document.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault(); au.paused?au.play():au.pause();} else if(e.code==='ArrowRight'){e.preventDefault();seekBeat(1);} else if(e.code==='ArrowLeft'){e.preventDefault();seekBeat(-1);} });
  titleCard(); requestAnimationFrame(frame);
})();
</script>
